CONFIG_ZMK_USB=n # ZMK_USB is only allowed when: not split or, split and role is central (i.e., not right_dongle)

## PAW3395 Driver
## https://github.com/badjeff/zmk-paw3395-driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PAW3395=y
CONFIG_ZMK_POINTING=y
#CONFIG_SPI_LOG_LEVEL_DBG=y
# CONFIG_PAW3395_LOG_LEVEL_DBG=y

## Swap/Invert are DTS properties - see charybdis_paw3395.dtsi
CONFIG_PAW3395_REPORT_INTERVAL_MIN=12
# CONFIG_PAW3395_INIT_POWER_UP_EXTRA_DELAY_MS=3000 // uncomment if the sensor is not detected after power-on
